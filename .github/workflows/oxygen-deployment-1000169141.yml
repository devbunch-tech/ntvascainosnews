name: Storefront 1000169141
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # O @ntv/shared é dependência do portal e precisa estar compilado antes do build.
      - name: Build shared package
        run: npm run build -w @ntv/shared

      # `--path apps/portal` é obrigatório: o projeto Hydrogen é um workspace, não a raiz
      # do repositório. Sem isso o CLI responde "Looks like you're trying to run a
      # Hydrogen command outside of a Hydrogen project".
      # `--no-lockfile-check`: o CLI exige um lockfile dentro do projeto apontado
      # por --path, e num monorepo o package-lock.json fica na raiz. O npm ci do
      # passo anterior já garante a instalação determinística.
      - name: Build and Publish to Oxygen
        run: npx shopify hydrogen deploy --path apps/portal --no-lockfile-check
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000169141 }}
