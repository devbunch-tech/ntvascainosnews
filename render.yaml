# Blueprint da apps/api no Render. Em Render → New → Blueprint, aponte para este
# repositório: ele lê este arquivo e cria o serviço já configurado.
#
# O banco NÃO está aqui de propósito — o Render não oferece MongoDB gerenciado.
# Use o MongoDB Atlas e cole a connection string em MONGODB_URI.
# Passo a passo completo em docs/deploy.md.
#
# ESTE ARQUIVO ESTÁ NO PLANO FREE, para validar o circuito antes de gastar.
# Três consequências, todas do plano e nenhuma do código (ver docs/deploy.md):
#   1. Sem disco persistente: as imagens enviadas pelo admin somem a cada
#      redeploy, restart ou hibernação, e os posts ficam apontando para URL morta.
#   2. Sem cron: o Render não tem cron gratuito. A ingestão de RSS e o sync
#      precisam ser disparados à mão (veja "Rodar os jobs no free" em docs/deploy.md).
#   3. Hiberna após 15 min sem tráfego; a visita seguinte espera ~1 min.
# Para produção de verdade, troque `plan: free` por `starter`, descomente o bloco
# `disk:` e os dois serviços de cron no fim do arquivo.
services:
  - name: ntv-api
    type: web
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # O contexto é a raiz do monorepo: o Dockerfile precisa do package-lock.json
    # e do packages/shared, que ficam fora de apps/api.
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    # disk:
    #   name: uploads
    #   mountPath: /data
    #   sizeGB: 5
    envVars:
      # Connection string do Atlas. `sync: false` = o Render pergunta na criação
      # e guarda como secret, em vez de deixar no repositório.
      - key: MONGODB_URI
        sync: false
      # Assina os JWTs de login do admin e do portal. Trocar invalida as sessões.
      - key: JWT_SECRET
        generateValue: true
      # Domínio público desta API — entra na URL das imagens enviadas.
      # Ajuste se você apontar um domínio próprio para o serviço.
      - key: PUBLIC_API_URL
        value: https://api.ntvascainosnews.com.br
      # Origens de browser autorizadas: admin e portal. O SSR do Hydrogen é
      # server-to-server, não manda Origin e não precisa estar listado.
      - key: CORS_ORIGINS
        value: https://admin.ntvascainosnews.com.br,https://ntvascainosnews.com.br,https://www.ntvascainosnews.com.br
      # No free não há disco montado, então os uploads ficam no filesystem
      # efêmero do container. Com disco, isto vira /data/uploads.
      - key: UPLOADS_DIR
        value: ./uploads

