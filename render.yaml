# Blueprint da apps/api no Render. Em Render → New → Blueprint, aponte para este
# repositório: ele lê este arquivo e cria o serviço já configurado.
#
# O banco NÃO está aqui de propósito — o Render não oferece MongoDB gerenciado.
# Use o MongoDB Atlas e cole a connection string em MONGODB_URI.
# Passo a passo completo em docs/deploy.md.
services:
  - name: ntv-api
    type: web
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # O contexto é a raiz do monorepo: o Dockerfile precisa do package-lock.json
    # e do packages/shared, que ficam fora de apps/api.
    dockerContext: .
    region: oregon
    # `starter` e não `free`: o plano gratuito não tem disco persistente, e sem
    # disco todo upload de imagem some no deploy seguinte. Ele também hiberna
    # por inatividade, o que faria a primeira visita ao portal esperar o cold start.
    plan: starter
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 5
    envVars:
      # Connection string do Atlas. `sync: false` = o Render pergunta na criação
      # e guarda como secret, em vez de deixar no repositório.
      - key: MONGODB_URI
        sync: false
      # Assina os JWTs de login do admin e do portal. Trocar invalida as sessões.
      - key: JWT_SECRET
        generateValue: true
      # Domínio público desta API — entra na URL das imagens enviadas.
      # Ajuste se você apontar um domínio próprio para o serviço.
      - key: PUBLIC_API_URL
        value: https://api.ntvascainosnews.com.br
      # Origens de browser autorizadas: admin e portal. O SSR do Hydrogen é
      # server-to-server, não manda Origin e não precisa estar listado.
      - key: CORS_ORIGINS
        value: https://admin.ntvascainosnews.com.br,https://ntvascainosnews.com.br,https://www.ntvascainosnews.com.br
      - key: UPLOADS_DIR
        value: /data/uploads

  # Ingestão de RSS: é o que traz notícia nova sem ninguém digitar. Sem este cron,
  # o site só mostra o que for publicado à mão no admin.
  - name: ntv-rss
    type: cron
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    schedule: "*/15 * * * *"
    dockerCommand: npm run rss -w @ntv/api
    envVars:
      # Mesmo banco do serviço web, sem precisar colar a string de novo.
      - key: MONGODB_URI
        fromService:
          type: web
          name: ntv-api
          envVarKey: MONGODB_URI

  # Vídeos do YouTube e jogos. De hora em hora é suficiente.
  - name: ntv-sync
    type: cron
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    schedule: "17 * * * *"
    dockerCommand: npm run sync -w @ntv/api
    envVars:
      - key: MONGODB_URI
        fromService:
          type: web
          name: ntv-api
          envVarKey: MONGODB_URI
