# Blueprint da apps/api no Render. Em Render → New → Blueprint, aponte para este
# repositório: ele lê este arquivo e cria os serviços já configurados.
#
# O banco NÃO está aqui de propósito — o Render não oferece MongoDB gerenciado.
# Use o MongoDB Atlas e cole a connection string em MONGODB_URI.
# Passo a passo completo em docs/deploy.md.
#
# Configuração de produção: plano pago, disco para os uploads e os dois crons.
# O disco é 1 GB de propósito — sobra para as imagens do admin e custa pouco.
# Disco no Render pode crescer depois, mas não encolher, então começar pequeno
# é a decisão reversível.
services:
  - name: ntv-api
    type: web
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # O contexto é a raiz do monorepo: o Dockerfile precisa do package-lock.json
    # e do packages/shared, que ficam fora de apps/api.
    dockerContext: .
    # Oregon porque é onde está o cluster do Atlas. Banco e API no mesmo lugar
    # foi o que derrubou o tempo da home de 1,3s para 0,4s — cada consulta
    # deixou de atravessar o continente.
    region: oregon
    plan: starter
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      # Connection string do Atlas. `sync: false` = o Render pergunta na criação
      # e guarda como secret, em vez de deixar no repositório.
      - key: MONGODB_URI
        sync: false
      # Assina os JWTs de login do admin e do portal. Trocar invalida as sessões.
      - key: JWT_SECRET
        generateValue: true
      # Domínio público desta API — entra na URL das imagens enviadas.
      - key: PUBLIC_API_URL
        value: https://api.ntvascainosnews.com.br
      # Origens de browser autorizadas: admin e portal. O SSR do Hydrogen é
      # server-to-server, não manda Origin e não precisa estar listado.
      - key: CORS_ORIGINS
        value: https://admin.ntvascainosnews.com.br,https://ntvascainosnews.com.br,https://www.ntvascainosnews.com.br
      # Aponta para o disco persistente montado acima.
      - key: UPLOADS_DIR
        value: /data/uploads

  # Ingestão de RSS: é o que traz notícia nova sem ninguém digitar.
  - name: ntv-rss
    type: cron
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    schedule: "*/15 * * * *"
    dockerCommand: npm run rss -w @ntv/api
    envVars:
      # Mesmo banco do serviço web, sem precisar colar a string de novo.
      - key: MONGODB_URI
        fromService:
          type: web
          name: ntv-api
          envVarKey: MONGODB_URI

  # Vídeos do YouTube e jogos. De hora em hora é suficiente.
  - name: ntv-sync
    type: cron
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    schedule: "17 * * * *"
    dockerCommand: npm run sync -w @ntv/api
    envVars:
      - key: MONGODB_URI
        fromService:
          type: web
          name: ntv-api
          envVarKey: MONGODB_URI
