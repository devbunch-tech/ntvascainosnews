<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img"
     aria-label="Players Place — o mercado da bola em números. Acesse playersplace.com.br">
  <title>Players Place — o mercado da bola em números</title>

  <!--
    Banner 320x320 para a Loja/sidebar do NTV News.
    Paleta tirada do próprio site (tokens do CSS de produção):
      verde  #0E4632  (theme-color)
      lime   #C8F04B  (color-brandlime)
      cream  #F6F4ED  (color-brandcream)
      ink    #131711  (color-ink)
    Fonte declarada com fallback de sistema: SVG dentro de <img> é documento
    isolado e não carrega webfont, então nada pode depender de Archivo estar lá.
  -->
  <defs>
    <clipPath id="frame">
      <rect width="320" height="320" />
    </clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14573D" />
      <stop offset="1" stop-color="#0B3826" />
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="320" height="320" fill="url(#glow)" />

    <!-- Motivo de fundo: barras de valor de mercado, bem discretas. -->
    <g fill="#C8F04B" opacity="0.10">
      <rect x="196" y="214" width="16" height="46" />
      <rect x="218" y="190" width="16" height="70" />
      <rect x="240" y="160" width="16" height="100" />
      <rect x="262" y="126" width="16" height="134" />
      <rect x="284" y="196" width="16" height="64" />
    </g>
    <path d="M196 214 L226 190 L248 160 L270 126 L296 196" fill="none" stroke="#C8F04B"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    <circle cx="270" cy="126" r="4.5" fill="#C8F04B" />

    <!-- Selo -->
    <rect x="28" y="30" width="150" height="24" fill="#C8F04B" />
    <text x="38" y="47" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="700" letter-spacing="1.6" fill="#0E4632">MERCADO DA BOLA</text>

    <!-- Marca -->
    <text x="28" y="128" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="800" letter-spacing="-1.2" fill="#F6F4ED">PLAYERS</text>
    <text x="28" y="172" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="800" letter-spacing="-1.2" fill="#C8F04B">PLACE</text>
    <rect x="28" y="186" width="64" height="5" fill="#F6F4ED" />

    <!-- Promessa -->
    <text x="28" y="220" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14.5" font-weight="500" fill="#DDE3D6">Valores de mercado, elencos e</text>
    <text x="28" y="240" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14.5" font-weight="500" fill="#DDE3D6">transferências — em português.</text>

    <!-- Chamada -->
    <rect x="28" y="258" width="150" height="38" fill="#C8F04B" />
    <text x="45" y="282" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="800" letter-spacing="1.2" fill="#0E4632">ACESSAR AGORA</text>

    <text x="192" y="282" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="600" letter-spacing="0.3" fill="#9FB3A4">playersplace.com.br</text>

    <rect x="0" y="0" width="320" height="320" fill="none" stroke="#0A2E1F" stroke-width="2" />
  </g>
</svg>
